<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Config Card Maker</title>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geist: editor UI · Satoshi: poster type -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js"></script>
<style>
  /* Satoshi (Indian Type Foundry, via Fontshare) */
  @font-face { font-family: "Satoshi"; src: url("https://cdn.fontshare.com/wf/TTX2Z3BF3P6Y5BQT3IV2VNOK6FL22KUT/7QYRJOI3JIMYHGY6CH7SOIFRQLZOLNJ6/KFIAZD4RUMEZIYV6FQ3T3GP5PDBDB6JY.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Satoshi"; src: url("https://cdn.fontshare.com/wf/P2LQKHE6KA6ZP4AAGN72KDWMHH6ZH3TA/ZC32TK2P7FPS5GFTL46EU6KQJA24ZYDB/7AHDUZ4A7LFLVFUIFSARGIWCRQJHISQP.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Satoshi"; src: url("https://cdn.fontshare.com/wf/LAFFD4SDUCDVQEXFPDC7C53EQ4ZELWQI/PXCT3G6LO6ICM5I3NTYENYPWJAECAWDD/GHM6WVH6MILNYOOCXHXB5GTSGNTMGXZR.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

  :root {
    --ui-bg: #2C2C2C;
    --ui-line: #3d3d3d;
    --ui-field: #383838;
    --ui-text: #ffffff;
    --ui-muted: #a0a0a0;
    --ui-accent: #0D99FF;
    --panel-w: 300px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }

  body {
    background-color: #111;
    background-image: radial-gradient(#262626 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: "Geist", system-ui, sans-serif;
    color: var(--ui-text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px;
    min-height: 100%;
  }

  /* Preview: the canvas renders at 1080×1440 and is scaled to fit */
  #stage {
    display: block;
    flex: none;
    width: min(calc((100vh - 32px) * 0.75), calc(100vw - var(--panel-w) - 56px), 720px);
    aspect-ratio: 3 / 4;
    background: #1E1E1E;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  #stage.dragging { outline: 3px dashed var(--ui-accent); outline-offset: 6px; }

  /* ───────────────────────── Editor panel ───────────────────────── */
  .panel {
    --ease: cubic-bezier(.22, 1, .36, 1);
    width: var(--panel-w);
    flex: none;
    background: var(--ui-bg);
    border: 1px solid var(--ui-line);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    font-size: 13px;
    overflow: hidden;
  }
  .panel header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--ui-line);
  }
  .panel header svg { width: 12px; height: auto; }
  .panel header h1 { font-size: 13px; font-weight: 500; }
  .panel section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--ui-line);
    display: grid;
    gap: 10px;
  }
  .panel section:last-child { border-bottom: 0; }
  .panel h2 {
    font-size: 11px;
    font-weight: 500;
    color: var(--ui-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .field { display: grid; gap: 5px; }
  .field > span { color: var(--ui-muted); font-size: 12px; }
  .field input[type=text] {
    width: 100%;
    background: var(--ui-field);
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--ui-text);
    font: inherit;
    padding: 8px 10px;
  }
  .field input[type=text]:hover { border-color: #4a4a4a; }
  .field input[type=text]:focus { outline: none; border-color: var(--ui-accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* background swatches */
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 2px; }
  .swatch {
    appearance: none;
    position: relative;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    cursor: pointer;
    transition: transform .2s cubic-bezier(.22, 1, .36, 1);
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--ui-accent);
    opacity: 0;
    transform: scale(.85);
    transition: opacity .2s ease, transform .25s cubic-bezier(.22, 1, .36, 1);
  }
  .swatch[aria-checked="true"]::after { opacity: 1; transform: none; }
  .swatch:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
  @media (max-width: 760px) { .swatch { width: 34px; height: 34px; } }

  .photo-pick { display: flex; align-items: center; gap: 10px; }
  .thumb {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--ui-field) center / cover no-repeat;
    flex: none;
    display: grid;
    place-items: center;
    color: var(--ui-muted);
    font-size: 18px;
  }
  /* photo row states: empty → loading → ready */
  .photo-pick .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #555;
    border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo-pick:not([data-state=empty]) .plus,
  .photo-pick:not([data-state=empty]) #uploadBtn,
  .photo-pick:not([data-state=loading]) .spinner,
  .photo-pick:not([data-state=ready]) #clearPhoto { display: none; }
  .photo-pick[data-state=loading] .status::after { content: "Uploading…"; color: var(--ui-muted); }
  input[type=range] { width: 100%; accent-color: var(--ui-accent); }
  #stage.can-edit { cursor: pointer; }
  #stage.editing { cursor: default; }
  #stage.move { cursor: move; }
  #stage.nwse { cursor: nwse-resize; }
  #stage.nesw { cursor: nesw-resize; }

  .btn {
    appearance: none;
    border: 0;
    background: var(--ui-field);
    color: var(--ui-text);
    font: inherit;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
  }
  .btn:hover { background: #444; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, .btn:focus-within { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
  .btn.primary { background: var(--ui-accent); }
  .btn.primary:hover:not(:disabled) { background: #0B87E0; }
  .btn.ghost { background: transparent; color: var(--ui-muted); padding-inline: 6px; }
  .btn.ghost:hover { color: #fff; background: transparent; }
  .btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .transport { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .transport .btn { width: 34px; height: 30px; padding: 0; }
  .time { color: var(--ui-muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 64px; text-align: right; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  /* render progress: a rainbow in the poster palette with a slow shimmer */
  .progress {
    height: 6px;
    border-radius: 3px;
    background: var(--ui-field);
    overflow: hidden;
  }
  .progress i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #FF8AD8, #FFD02B, #0ACF83, #4CC9FF, #B095FF, #FF5A36, #FF8AD8) 0 0 / 266px 100% repeat-x;
    animation: shimmer 1.4s linear infinite;
    transition: width .12s linear;
  }
  @keyframes shimmer { to { background-position-x: 266px; } }
  .note { color: var(--ui-muted); font-size: 11.5px; line-height: 1.45; }

  /* PNG scale menu (Figma-style dropdown) */
  .menu-wrap { position: relative; }
  .menu-wrap > .btn { height: 100%; }
  .menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 6px);
    min-width: 200px;
    padding: 6px;
    background: #1E1E1E;
    border: 1px solid #383838;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    display: grid;
    z-index: 5;
    transform-origin: bottom right;
    animation: menuIn .18s var(--ease) both;
  }
  .menu button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ui-text);
    font: inherit;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
  }
  .menu button span:last-child { color: var(--ui-muted); font-variant-numeric: tabular-nums; }
  .menu button:hover, .menu button:focus-visible { background: var(--ui-accent); outline: none; }
  .menu button:hover span:last-child, .menu button:focus-visible span:last-child { color: rgba(255,255,255,.8); }
  @keyframes menuIn { from { opacity: 0; transform: translateY(4px) scale(.96); } }

  /* entrance */
  #stage { animation: stageIn .9s var(--ease) both; }
  .panel { animation: panelIn .8s var(--ease) .12s both; }
  .panel > * { animation: itemIn .6s var(--ease) both; }
  .panel > :nth-child(1) { animation-delay: .28s; }
  .panel > :nth-child(2) { animation-delay: .34s; }
  .panel > :nth-child(3) { animation-delay: .40s; }
  .panel > :nth-child(4) { animation-delay: .46s; }
  .panel > :nth-child(5) { animation-delay: .52s; }
  .panel > :nth-child(6) { animation-delay: .58s; }
  @keyframes stageIn { from { opacity: 0; transform: scale(.98); } }
  @keyframes panelIn { from { opacity: 0; transform: translateX(28px) scale(.98); } }
  @keyframes itemIn  { from { opacity: 0; transform: translateY(10px); } }

  /* ───────────────────────── Mobile dock ───────────────────────── */
  .dock, .toast { display: none; }
  .dock {
    --ease: cubic-bezier(.22, 1, .36, 1);
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 20;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: rgba(44, 44, 44, .92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--ui-line);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,.5);
    animation: dockIn .8s var(--ease) .45s both;
  }
  .dock-btn {
    appearance: none;
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--ui-field);
    color: var(--ui-text);
    font: inherit;
    font-size: 14px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .dock-btn.accent { background: var(--ui-accent); }
  .dock-btn:disabled { opacity: .55; }
  .dock-btn:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
  .dock .time { min-width: 0; }
  .dock-progress {
    position: absolute;
    left: 14px;
    right: 14px;
    top: -1px;
    height: 3px;
    border-radius: 2px;
    overflow: hidden;
  }
  .dock-progress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #FF8AD8, #FFD02B, #0ACF83, #4CC9FF, #B095FF, #FF5A36, #FF8AD8) 0 0 / 266px 100% repeat-x;
    animation: shimmer 1.4s linear infinite;
    transition: width .12s linear;
  }

  .sheet-wrap { position: relative; }
  .sheet {
    position: absolute;
    right: -2px;
    bottom: calc(100% + 16px);
    width: min(300px, calc(100vw - 24px));
    padding: 6px;
    background: #1E1E1E;
    border: 1px solid #383838;
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
    overflow: hidden;
    transform-origin: bottom right;
    animation: menuIn .22s var(--ease) both;
  }
  .sheet-page { display: grid; }
  .sheet-page.from-right { animation: pageR .28s var(--ease) both; }
  .sheet-page.from-left  { animation: pageL .28s var(--ease) both; }
  .sheet button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ui-text);
    font: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 8px 12px;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
  }
  .sheet button:active, .sheet button:focus-visible { background: #2C2C2C; outline: none; }
  .sheet svg { width: 22px; height: 22px; flex: none; color: var(--ui-muted); }
  .sheet b { display: block; font-weight: 500; }
  .sheet small { display: block; color: var(--ui-muted); font-size: 12px; margin-top: 2px; }
  .sheet [data-scale] { justify-content: space-between; }
  .sheet [data-scale] small { margin: 0; font-variant-numeric: tabular-nums; }
  .sheet .chev { margin-left: auto; font-style: normal; font-size: 22px; color: var(--ui-muted); }
  .sheet .back { min-height: 40px; color: var(--ui-muted); font-size: 13px; gap: 6px; }
  .sheet .back i { font-style: normal; font-size: 20px; line-height: 1; }
  @keyframes pageR { from { opacity: 0; transform: translateX(24px); } }
  @keyframes pageL { from { opacity: 0; transform: translateX(-24px); } }
  @keyframes dockIn { from { opacity: 0; transform: translateY(24px); } }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom));
    z-index: 21;
    transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    padding: 10px 16px;
    background: #1E1E1E;
    border: 1px solid #383838;
    border-radius: 999px;
    color: var(--ui-text);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    animation: toastIn .3s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

  @media (prefers-reduced-motion: reduce) {
    #stage, .panel, .panel > *, .menu, .progress i, .dock, .dock-progress i, .sheet, .sheet-page, .toast { animation: none !important; }
  }

  #stage.editing { touch-action: none; }

  @media (max-width: 760px) {
    /* let the page grow with its content so the bottom padding is real */
    html, body { height: auto; }
    body {
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 16px calc(92px + env(safe-area-inset-bottom));
    }
    #stage { width: min(calc(100vw - 32px), 560px); }
    .panel { width: min(100%, 560px); }
    .desk-only { display: none !important; }
    .dock { display: grid; }
    .toast { display: block; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(28px) scale(.98); } }
  }
</style>
</head>
<body>

<canvas id="stage" width="1080" height="1440" role="img" aria-label="Animated Config attendee card"></canvas>

<aside class="panel" aria-label="Card settings">
  <header>
    <svg viewBox="0 0 38 57" aria-hidden="true">
      <path fill="#1ABCFE" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/>
      <path fill="#0ACF83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/>
      <path fill="#FF7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/>
      <path fill="#F24E1E" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/>
      <path fill="#A259FF" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/>
    </svg>
    <h1>Config card maker</h1>
  </header>

  <section>
    <label class="field"><span>Name</span><input type="text" id="in-name" placeholder="Your name" maxlength="28" autocomplete="name"></label>
    <label class="field"><span>Position</span><input type="text" id="in-role" placeholder="Product Designer at Acme" maxlength="56" autocomplete="organization-title"></label>
    <div class="photo-pick" id="photoPick" data-state="empty">
      <div class="thumb" id="thumb"><span class="plus">＋</span><span class="spinner" aria-hidden="true"></span></div>
      <label class="btn" id="uploadBtn">Upload photo<input type="file" id="in-photo" accept="image/*"></label>
      <span class="status" role="status"></span>
      <button class="btn" id="clearPhoto" type="button">Remove</button>
    </div>
    <p class="note">Click the photo on the card to move or resize it. Drag the corners or pinch to scale, scroll to zoom, click outside to finish.</p>
  </section>

  <section>
    <h2>Event</h2>
    <div class="two">
      <label class="field"><span>Date</span><input type="text" id="in-date" maxlength="24"></label>
      <label class="field"><span>Location</span><input type="text" id="in-place" maxlength="28"></label>
    </div>
  </section>

  <section>
    <h2>Background</h2>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Background colour"></div>
  </section>

  <section class="desk-only">
    <h2>Preview</h2>
    <div class="transport">
      <button class="btn" id="play" type="button" aria-label="Pause">❚❚</button>
      <input type="range" id="scrub" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
      <span class="time" id="time">0.0 / 10.0s</span>
    </div>
  </section>

  <section class="desk-only">
    <h2>Export</h2>
    <div class="actions">
      <button class="btn primary" id="dlVideo" type="button">Download video</button>
      <div class="menu-wrap">
        <button class="btn" id="dlStill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pngMenu">PNG ▾</button>
        <div class="menu" id="pngMenu" role="menu" aria-label="PNG size" hidden>
          <button role="menuitem" type="button" data-scale="1"><span>PNG 1x</span><span>1080 × 1440</span></button>
          <button role="menuitem" type="button" data-scale="2"><span>PNG 2x</span><span>2160 × 2880</span></button>
          <button role="menuitem" type="button" data-scale="4"><span>PNG 4x</span><span>4320 × 5760</span></button>
        </div>
      </div>
    </div>
    <div class="progress" id="progress" hidden><i></i></div>
    <p class="note" id="exportNote">1080 × 1440 · 60 fps · 10 s MP4</p>
  </section>
</aside>

<!-- Mobile: playback + download dock, pinned to the bottom -->
<nav class="dock" aria-label="Playback and download">
  <div class="dock-progress" id="dockProgress" hidden><i></i></div>
  <button class="dock-btn" id="mPlay" type="button" aria-label="Pause">❚❚</button>
  <input type="range" id="mScrub" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
  <span class="time" id="mTime">0.0s</span>
  <div class="sheet-wrap">
    <button class="dock-btn accent" id="mDownload" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sheet" aria-label="Download">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
    <div class="sheet" id="sheet" role="menu" aria-label="Download" hidden>
      <div class="sheet-page" data-page="main">
        <button type="button" role="menuitem" data-act="video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>
          <span><b>Download video</b><small>MP4 · 1080 × 1440 · 60 fps</small></span>
        </button>
        <button type="button" role="menuitem" data-act="png">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
          <span><b>Download PNG</b><small>1x, 2x or 4x</small></span>
          <i class="chev" aria-hidden="true">›</i>
        </button>
      </div>
      <div class="sheet-page" data-page="png" hidden>
        <button type="button" class="back" data-act="back"><i aria-hidden="true">‹</i> PNG size</button>
        <button type="button" role="menuitem" data-scale="1"><span><b>PNG 1x</b></span><small>1080 × 1440</small></button>
        <button type="button" role="menuitem" data-scale="2"><span><b>PNG 2x</b></span><small>2160 × 2880</small></button>
        <button type="button" role="menuitem" data-scale="4"><span><b>PNG 4x</b></span><small>4320 × 5760</small></button>
      </div>
    </div>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ───────────────────────── Data ───────────────────────── */

let saved = {};
try { saved = JSON.parse(localStorage.getItem('config-card-v2') || '{}'); } catch (e) {}
const state = { ...defaults, ...saved };
let photo = null;
let photoBox = null;   // where the photo sits on the card: { x, y, w, h } in card px

// default placement: cover the mask, biased towards the top (faces)
function coverBox(img) {
  const m = L.mask;
  const s = Math.max(m.w / img.width, m.h / img.height);
  const w = img.width * s, h = img.height * s;
  return { x: m.x - (w - m.w) / 2, y: m.y - (h - m.h) * 0.3, w, h };
}

/* ───────────────────────── Drawing helpers ───────────────────────── */
function setFont(ctx, weight, size, spacing = 0) {
  ctx.font = `${weight} ${size}px Satoshi, system-ui, sans-serif`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
}

// Text that slides up from behind a line mask
function riseText(ctx, text, x, y, size, lh, p, align = 'left') {
  if (p <= 0 || !text) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y - 4, W, lh + 8);
  ctx.clip();
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.globalAlpha *= clamp01(p * 1.6);
  ctx.fillText(text, x, y + (1 - p) * lh + (lh - size) / 2);
  ctx.restore();
}

function ellipsize(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
  return text.trimEnd() + '…';
}

function wrap(ctx, text, max, maxLines) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width <= max || !line) { line = test; continue; }
    lines.push(line);
    line = words[i];
    if (lines.length === maxLines - 1) { line = words.slice(i).join(' '); break; }
  }
  if (line) lines.push(line);
  return lines.slice(0, maxLines).map((l, i) => i === maxLines - 1 ? ellipsize(ctx, l, max) : l);
}

// photo (or plain frame tone) filling the mask rectangle
function drawContent(ctx, t) {
  const m = L.mask;
  ctx.fillStyle = theme().frame;
  ctx.fillRect(m.x, m.y, m.w, m.h);
  if (!photo) return;
  const z = lerp(1.12, 1, outCubic(prog(t, T.reveal, 2.4)));
  const b = photoBox;
  ctx.drawImage(photo, b.x + b.w / 2 - b.w * z / 2, b.y + b.h / 2 - b.h * z / 2, b.w * z, b.h * z);
}

function clipToMask(ctx) {
  const m = L.mask;
  ctx.translate(m.x, m.y);
  ctx.scale(m.w / 200, m.h / 300);
  ctx.clip(MASK);
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
}

function drawFigmaMark(ctx, x, y, h) {
  const k = h / 57;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  for (const p of LOGO) { ctx.fillStyle = p.color; ctx.fill(p.path); }
  ctx.restore();
}

function drawTile(ctx, tile, t) {
  const p = prog(t, T.pieces + tile.delay, 1.15);
  if (p <= 0) return;
  const out = inOutCubic(prog(t, T.reveal + tile.sweep * 0.7, 0.55));
  if (out >= 1) return;

  const e = outQuart(p);
  // travel along a gentle arc into the cell
  const dx = tile.x - tile.sx, dy = tile.y - tile.sy;
  const len = Math.hypot(dx, dy) || 1;
  const arc = Math.sin(e * Math.PI) * tile.bend;
  const x = lerp(tile.sx, tile.x, e) - dy / len * arc;
  const y = lerp(tile.sy, tile.y, e) + dx / len * arc;

  const size = TILES.size * 0.9;
  const s = lerp(0.55, 1, outCubic(p)) * (1 - out * 0.5);
  const r = size / 2;

  ctx.save();
  ctx.globalAlpha = clamp01(p * 4) * (1 - out);
  ctx.translate(x, y);
  ctx.rotate(tile.rot * (1 - outCubic(p)));
  ctx.scale(s, s);
  ctx.fillStyle = tileColor(tile);
  ctx.beginPath();
  ctx.roundRect(-r, -r, size, size, tile.corners.map(k => k ? r : size * 0.08));
  ctx.fill();
  ctx.restore();
}

/* ───────────────────────── Frame renderer ───────────────────────── */
let RS = 1;   // render scale: 1 for preview and video, 2 or 4 for large PNGs

function draw(ctx, t, scale = 1) {
  RS = scale;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.globalAlpha = 1;

  /* background + colour bloom */
  const bg = theme().bg;
  const ringColors = [C.pink, C.yellow, C.lilac, C.sky, bg];
  const lastRing = T.bloom + 4 * 0.11 + 1.15;
  if (t >= lastRing) {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = C.dark;
    ctx.fillRect(0, 0, W, H);
    ringColors.forEach((col, i) => {
      const p = inOutCubic(prog(t, T.bloom + i * 0.11, 1.15));
      if (p <= 0) return;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, p * 920, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /* greeting: blinking caret types "Hi there" */
  if (t >= T.caret && t < T.greetOut + 0.8) {
    const pout = inCubic(prog(t, T.greetOut, 0.6));
    setFont(ctx, 500, 64, -1);
    const x0 = W / 2 - ctx.measureText(GREETING).width / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, H / 2 - 50, W, 100);
    ctx.clip();
    ctx.translate(0, -pout * 90);
    ctx.globalAlpha = 1 - pout;

    // typed characters, each with a quick fade so keystrokes feel soft
    ctx.fillStyle = C.white;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    let typed = '';
    KEYS.forEach((k, i) => {
      const a = prog(t, T.type + k, 0.06);
      if (a <= 0) return;
      const before = GREETING.slice(0, i);
      ctx.save();
      ctx.globalAlpha *= a;
      ctx.fillText(GREETING[i], x0 + ctx.measureText(before).width, H / 2);
      ctx.restore();
      typed = GREETING.slice(0, i + 1);
    });

    // caret: solid while typing, blinking while idle
    const lastKey = T.type + KEYS[KEYS.length - 1];
    const typing = t >= T.type - 0.05 && t <= lastKey + 0.35;
    const since = t < T.type ? t - T.caret : t - (lastKey + 0.35);
    const blink = typing ? 1 : clamp01(Math.cos(since * Math.PI * 1.9) * 4 + 0.5);
    const appear = outCubic(prog(t, T.caret, 0.2));
    const cx = x0 + ctx.measureText(typed).width + (typed ? 5 : 0);
    ctx.globalAlpha *= blink * appear;
    ctx.fillStyle = C.hot;
    ctx.fillRect(cx, H / 2 - 37, 4, 74);
    ctx.restore();
  }

  /* photo mask, revealed as the pieces dissolve */
  const shown = inOutSine(prog(t, T.reveal - 0.15, 0.45));
  if (shown > 0) {
    ctx.save();
    ctx.globalAlpha = shown;
    clipToMask(ctx);
    drawContent(ctx, t);
    ctx.restore();
  }

  /* pieces */
  if (t >= T.pieces) for (const tile of TILES.list) drawTile(ctx, tile, t);

  /* header: Figma tile + date / place */
  const ph = outCubic(prog(t, T.header, 0.9));
  if (ph > 0) {
    const tl = L.tile;
    ctx.save();
    ctx.globalAlpha = ph;
    const ts = lerp(0.85, 1, ph);
    ctx.translate(tl.x + tl.s / 2, tl.y + tl.s / 2);
    ctx.scale(ts, ts);
    ctx.fillStyle = C.dark;
    ctx.beginPath();
    ctx.roundRect(-tl.s / 2, -tl.s / 2, tl.s, tl.s, 16);
    ctx.fill();
    drawFigmaMark(ctx, -10, -15, 30);
    ctx.restore();

    ctx.fillStyle = C.ink;
    setFont(ctx, 500, 24, 0.5);
    riseText(ctx, state.date.trim().toUpperCase(), L.header.x, L.header.y, 24, L.header.lh, outQuart(prog(t, T.header + 0.05, 0.8)), 'right');
    setFont(ctx, 400, 24, 0.5);
    riseText(ctx, state.place.trim().toUpperCase(), L.header.x, L.header.y + L.header.lh, 24, L.header.lh, outQuart(prog(t, T.header + 0.13, 0.8)), 'right');
  }

  /* multiplayer cursor with name + position */
  const pc = outCubic(prog(t, T.cursor, 1.0));
  if (pc > 0) {
    const drift = inOutSine(prog(t, T.cursor + 1.0, 1.2));
    const idle = t - (T.cursor + 1.0);
    const cx = L.cursor.x + (1 - pc) * 120 + Math.sin(idle * 1.3) * 5 * drift;
    const cy = L.cursor.y + (1 - pc) * 90 + Math.sin(idle * 0.9) * 4 * drift;

    ctx.save();
    ctx.globalAlpha = clamp01(pc * 1.5);
    ctx.translate(cx, cy);
    ctx.save();
    ctx.scale(L.cursor.s, L.cursor.s);
    ctx.translate(-2, -1.5);
    ctx.shadowColor = 'rgba(0,0,0,.22)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = theme().tag;
    ctx.fill(CURSOR);
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = C.white;
    ctx.stroke(CURSOR);
    ctx.restore();

    // name pill
    const pt = outCubic(prog(t, T.tag, 0.75));
    if (pt > 0) {
      setFont(ctx, 500, 34, -0.3);
      const name = ellipsize(ctx, state.name.trim() || 'Your name', L.tag.max - L.tag.pad * 2);
      const tw = ctx.measureText(name).width + L.tag.pad * 2;
      ctx.save();
      ctx.translate(L.tag.dx, L.tag.dy);
      const ss = lerp(0.8, 1, pt);
      ctx.scale(ss, ss);
      ctx.globalAlpha *= clamp01(pt * 1.4);
      ctx.fillStyle = theme().tag;
      ctx.beginPath();
      ctx.roundRect(0, 0, tw, L.tag.h, [6, 31, 31, 31]);
      ctx.fill();
      ctx.fillStyle = C.white;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(name, L.tag.pad, L.tag.h / 2 + 1);
      ctx.restore();
    }

    // position
    const role = state.role.trim();
    if (role) {
      setFont(ctx, 400, 28, -0.2);
      ctx.fillStyle = C.ink;
      wrap(ctx, role, L.role.max, 2).forEach((line, i) => {
        riseText(ctx, line, L.role.dx, L.role.dy + i * L.role.lh, 28, L.role.lh,
          outQuart(prog(t, T.tag + 0.12 + i * 0.06, 0.8)));
      });
    }
    ctx.restore();
  }

  /* I'M ATTENDING + Config wordmark */
  ctx.fillStyle = C.ink;
  setFont(ctx, 500, 26, 2);
  riseText(ctx, 'I’M ATTENDING', L.label.x, L.label.y, 26, 34, outQuart(prog(t, T.label, 0.8)));

  if (t >= T.word) {
    const s = L.word.w / 705;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, L.word.y - 6, W, 140 * s + 12);
    ctx.clip();
    GLYPHS.forEach((g, i) => {
      const p = outQuart(prog(t, T.word + i * 0.06, 1.0));
      if (p <= 0) return;
      ctx.save();
      ctx.globalAlpha = clamp01(p * 1.5);
      ctx.translate(L.word.x, L.word.y + (1 - p) * 140 * s);
      ctx.scale(s, s);
      ctx.fillStyle = C.ink;
      ctx.fill(g.path, g.rule);
      ctx.restore();
    });
    ctx.restore();
  }
}

/* ───────────────────────── Preview player ───────────────────────── */
const stage = document.getElementById('stage');
const sctx = stage.getContext('2d');
// desktop panel + mobile dock share one player
const playBtns = [document.getElementById('play'), document.getElementById('mPlay')];
const scrubs = [document.getElementById('scrub'), document.getElementById('mScrub')];
const timeEl = document.getElementById('time');
const mTimeEl = document.getElementById('mTime');

let playing = false, startAt = 0, current = 0, scrubbing = false;

function setTime(t) {
  current = Math.max(0, Math.min(END, t));
  render();
  if (!scrubbing) scrubs.forEach(s => { s.value = current / END; });
  timeEl.textContent = `${current.toFixed(1)} / ${END.toFixed(1)}s`;
  mTimeEl.textContent = `${current.toFixed(1)}s`;
}

function setPlayIcon(isPlaying) {
  playBtns.forEach(b => {
    b.textContent = isPlaying ? '❚❚' : '▶';
    b.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  });
}
function play(from) {
  stopEditing();
  if (from !== undefined) current = from;
  if (current >= END) current = 0;
  startAt = performance.now() - current * 1000;
  playing = true;
  setPlayIcon(true);
  requestAnimationFrame(tick);
}
function pause() {
  playing = false;
  setPlayIcon(false);
}
function tick(now) {
  if (!playing) return;
  const t = (now - startAt) / 1000;
  if (t >= END) { setTime(END); pause(); return; }
  setTime(t);
  requestAnimationFrame(tick);
}

playBtns.forEach(b => b.addEventListener('click', () => playing ? pause() : play()));
scrubs.forEach(s => {
  s.addEventListener('input', () => {
    scrubbing = true;
    pause();
    stopEditing();
    setTime(s.value * END);
    scrubs.forEach(o => { if (o !== s) o.value = s.value; });
  });
  s.addEventListener('change', () => { scrubbing = false; });
});

// show the finished composition while editing, so changes are visible
function showEdits() {
  if (!playing) setTime(Math.max(current, END));
}

/* ───────────────────────── Inputs ───────────────────────── */
function save() {
  try { localStorage.setItem('config-card-v2', JSON.stringify(state)); } catch (e) {}
}

['name', 'role', 'date', 'place'].forEach(key => {
  const input = document.getElementById('in-' + key);
  input.value = state[key];
  input.addEventListener('input', () => { state[key] = input.value; save(); showEdits(); });
});
// background colour swatches
const swatches = document.getElementById('swatches');
BACKGROUNDS.forEach(b => {
  const s = document.createElement('button');
  s.type = 'button';
  s.className = 'swatch';
  s.setAttribute('role', 'radio');
  s.setAttribute('aria-label', b.name);
  s.title = b.name;
  s.style.setProperty('--c', b.bg);
  s.dataset.bg = b.id;
  s.addEventListener('click', () => { state.bg = b.id; save(); syncSwatches(); showEdits(); });
  swatches.appendChild(s);
});
function syncSwatches() {
  swatches.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-checked', String(s.dataset.bg === theme().id)));
}
syncSwatches();

const thumb = document.getElementById('thumb');
const clearBtn = document.getElementById('clearPhoto');
const fileInput = document.getElementById('in-photo');
const photoPick = document.getElementById('photoPick');

async function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const prev = photoPick.dataset.state;
  photoPick.dataset.state = 'loading';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch (e) {
    URL.revokeObjectURL(url);
    photoPick.dataset.state = prev;
    return;
  }
  photo = img;
  photoBox = coverBox(img);
  thumb.style.backgroundImage = `url("${url}")`;
  photoPick.dataset.state = 'ready';
  // land on the finished poster with the new photo selected, ready to position
  startEditing();
}
function clearPhoto() {
  photo = null;
  photoBox = null;
  stopEditing();
  thumb.style.backgroundImage = '';
  photoPick.dataset.state = 'empty';
  fileInput.value = '';
  showEdits();
}

fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
clearBtn.addEventListener('click', clearPhoto);

/* ───────────────────────── Photo editing (Figma-style crop) ─────────────────────────
   Click the photo → the full image shows as a ghost beyond the mask with a selection
   box. Drag to move, drag a corner to scale, scroll to zoom, click outside to finish.
   The overlay only exists in the preview; exports never include it.                 */
let editing = false;
let drag = null;
const hitProbe = document.createElement('canvas').getContext('2d');

function toCard(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, k: W / r.width };
}
function inMask(p) {
  const m = L.mask;
  return hitProbe.isPointInPath(MASK, (p.x - m.x) * 200 / m.w, (p.y - m.y) * 300 / m.h);
}
function corners(b) {
  return [
    { x: b.x, y: b.y, ax: b.x + b.w, ay: b.y + b.h, cur: 'nwse' },
    { x: b.x + b.w, y: b.y, ax: b.x, ay: b.y + b.h, cur: 'nesw' },
    { x: b.x + b.w, y: b.y + b.h, ax: b.x, ay: b.y, cur: 'nwse' },
    { x: b.x, y: b.y + b.h, ax: b.x + b.w, ay: b.y, cur: 'nesw' },
  ];
}
function hitTest(p) {
  const b = photoBox, tol = 12 * p.k;
  const c = corners(b).find(c => Math.abs(p.x - c.x) <= tol && Math.abs(p.y - c.y) <= tol);
  if (c) return { type: 'scale', corner: c };
  if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return { type: 'move' };
  return null;
}

function drawEditOverlay(ctx) {
  const b = photoBox;
  const k = W / stage.getBoundingClientRect().width;   // card px per screen px
  // ghost of the whole image, then the masked part at full strength
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.drawImage(photo, b.x, b.y, b.w, b.h);
  ctx.restore();
  ctx.save();
  clipToMask(ctx);
  drawContent(ctx, END);
  ctx.restore();
  // selection box + handles
  ctx.save();
  ctx.strokeStyle = '#0D99FF';
  ctx.lineWidth = 1.5 * k;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  const hs = 8 * k;
  ctx.fillStyle = '#fff';
  for (const c of corners(b)) {
    ctx.fillRect(c.x - hs / 2, c.y - hs / 2, hs, hs);
    ctx.strokeRect(c.x - hs / 2, c.y - hs / 2, hs, hs);
  }
  // size badge, like Figma's dimension label
  const label = `${Math.round(b.w)} × ${Math.round(b.h)}`;
  ctx.font = `500 ${11 * k}px Geist, system-ui, sans-serif`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  const tw = ctx.measureText(label).width + 12 * k;
  const bx = b.x + b.w / 2 - tw / 2, by = b.y + b.h + 8 * k;
  ctx.fillStyle = '#0D99FF';
  ctx.beginPath();
  ctx.roundRect(bx, by, tw, 20 * k, 3 * k);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w / 2, by + 10 * k);
  ctx.restore();
}

function render() {
  draw(sctx, current);
  if (editing && photo) drawEditOverlay(sctx);
}

function startEditing() {
  pause();
  editing = true;
  stage.classList.add('editing');
  setTime(END);
}
function stopEditing() {
  if (!editing) return;
  editing = false;
  drag = null;
  stage.classList.remove('editing', 'move', 'nwse', 'nesw');
  render();
}

// two fingers on a touch screen pinch-zoom the photo
const touches = new Map();
let pinch = null;
function pinchFrame() {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}

stage.addEventListener('pointerdown', e => {
  const p = toCard(e);
  if (editing && e.pointerType === 'touch') {
    touches.set(e.pointerId, p);
    stage.setPointerCapture(e.pointerId);
    if (touches.size === 2) {
      drag = null;
      pinch = { ...pinchFrame(), box: { ...photoBox } };
      return;
    }
  }
  if (!editing) {
    if (!inMask(p) || current < T.reveal) return;
    if (!photo) { fileInput.click(); return; }
    startEditing();
    if (e.pointerType === 'touch') touches.set(e.pointerId, p);
  }
  if (e.pointerType === 'touch') p.k *= 2;   // larger handle targets for fingers
  const hit = hitTest(p);
  if (!hit) { stopEditing(); return; }
  stage.setPointerCapture(e.pointerId);
  drag = { ...hit, start: p, box: { ...photoBox } };
});

stage.addEventListener('pointermove', e => {
  const p = toCard(e);
  if (!editing) {
    stage.classList.toggle('can-edit', current >= T.reveal && inMask(p));
    return;
  }
  if (touches.has(e.pointerId)) touches.set(e.pointerId, p);
  if (pinch && touches.size === 2) {
    const f = pinchFrame(), b0 = pinch.box;
    const s = Math.max(120, b0.w * f.d / pinch.d) / b0.w;
    photoBox = {
      x: f.mx - (pinch.mx - b0.x) * s,
      y: f.my - (pinch.my - b0.y) * s,
      w: b0.w * s,
      h: b0.h * s,
    };
    render();
    return;
  }
  if (!drag) {
    const hit = hitTest(p);
    stage.classList.remove('move', 'nwse', 'nesw');
    if (hit) stage.classList.add(hit.type === 'move' ? 'move' : hit.corner.cur);
    return;
  }
  const b0 = drag.box;
  if (drag.type === 'move') {
    photoBox = { ...b0, x: b0.x + p.x - drag.start.x, y: b0.y + p.y - drag.start.y };
  } else {
    // scale from the opposite corner, keeping the image's proportions
    const { ax, ay } = drag.corner;
    const ratio = b0.h / b0.w;
    const w = Math.max(120, Math.abs(p.x - ax), Math.abs(p.y - ay) / ratio);
    const h = w * ratio;
    photoBox = {
      x: drag.corner.x < ax ? ax - w : ax,
      y: drag.corner.y < ay ? ay - h : ay,
      w, h,
    };
  }
  render();
});

function endPointer(e) {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  drag = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', e => {
  if (!editing) return;
  e.preventDefault();
  const p = toCard(e);
  const b = photoBox;
  const f = Math.exp(-e.deltaY * 0.0015);
  const w = Math.max(120, b.w * f), s = w / b.w;
  photoBox = { x: p.x - (p.x - b.x) * s, y: p.y - (p.y - b.y) * s, w, h: b.h * s };
  render();
}, { passive: false });

// clicking anywhere outside the card finishes editing
document.addEventListener('pointerdown', e => { if (editing && e.target !== stage) stopEditing(); });

stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('dragging'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dragging'));
stage.addEventListener('drop', e => {
  e.preventDefault();
  stage.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input[type=text]')) return;
  if (editing) {
    const step = e.shiftKey ? 20 : 2;
    const nudge = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (nudge) {
      e.preventDefault();
      photoBox = { ...photoBox, x: photoBox.x + nudge[0], y: photoBox.y + nudge[1] };
      render();
      return;
    }
    if (e.key === 'Escape' || e.key === 'Enter') { stopEditing(); return; }
  }
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'r' || e.key === 'R') play(0);
});

/* ───────────────────────── Export ───────────────────────── */
const dlVideo = document.getElementById('dlVideo');
const dlStill = document.getElementById('dlStill');
const progressEl = document.getElementById('progress');
const progressBar = progressEl.querySelector('i');
const note = document.getElementById('exportNote');
const noteDefault = note.textContent;

function slug() {
  return 'config-card' + (state.name.trim() ? '-' + state.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : '');
}
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const nextTask = () => new Promise(r => setTimeout(r, 0));

/* Quality-first H.264 (High profile, level 5.1).
   1st choice: constant-quality mode at QP 12 — visually lossless, and the flat poster
   colours keep the file compact. Otherwise a generous 40 Mbps variable bitrate.
   Returns every supported option so export can fall back if one fails mid-encode. */
const AVC_QP = 12;
async function avcConfigs() {
  if (!('VideoEncoder' in window) || !window.Mp4Muxer) return [];
  const base = { width: W, height: H, framerate: FPS, latencyMode: 'quality', avc: { format: 'avc' } };
  const tries = [
    { ...base, codec: 'avc1.640033', bitrateMode: 'quantizer' },
    { ...base, codec: 'avc1.640034', bitrateMode: 'quantizer' },
    ...['avc1.640033', 'avc1.640034', 'avc1.4d0033', 'avc1.42e033']
      .map(codec => ({ ...base, codec, bitrateMode: 'variable', bitrate: 40_000_000 })),
  ];
  const ok = [];
  for (const cfg of tries) {
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) ok.push(cfg); } catch (e) {}
  }
  return ok;
}

// Frame-accurate MP4: every frame is drawn at an exact timestamp, then encoded
async function exportMp4(config, onProgress) {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: FPS },
    fastStart: 'in-memory',
  });
  let failure = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => { failure = e; },
  });
  encoder.configure(config);

  const frames = Math.round(END * FPS);
  for (let i = 0; i < frames; i++) {
    if (failure) throw failure;
    draw(ctx, i / FPS);
    const frame = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    const opts = { keyFrame: i % (FPS * 2) === 0 };
    if (config.bitrateMode === 'quantizer') opts.avc = { quantizer: AVC_QP };
    encoder.encode(frame, opts);
    frame.close();
    while (encoder.encodeQueueSize > 6) await nextTask();
    if (i % 4 === 0) { onProgress(i / frames); await nextTask(); }
  }
  await encoder.flush();
  if (failure) throw failure;
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}

// Fallback for browsers without WebCodecs: record the canvas in real time
async function exportRecorded(onProgress) {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  draw(ctx, 0);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mimeType) throw new Error('This browser can’t record video');
  const stream = canvas.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16_000_000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  const t0 = performance.now();
  await new Promise(resolve => {
    (function frame(now) {
      const t = (now - t0) / 1000;
      draw(ctx, Math.min(t, END));
      onProgress(t / END);
      if (t >= END) return resolve();
      requestAnimationFrame(frame);
    })(t0);
  });
  rec.stop();
  await done;
  return { blob: new Blob(chunks, { type: mimeType }), ext: mimeType.includes('mp4') ? 'mp4' : 'webm' };
}

/* Messages: the panel note on desktop, a toast above the dock on mobile */
const toastEl = document.getElementById('toast');
const mobile = matchMedia('(max-width: 760px)');
let toastTimer;
function notify(msg, { sticky = false } = {}) {
  note.textContent = msg;
  if (!mobile.matches) return;
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.hidden = false;
  if (!sticky) toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
}

const mDownload = document.getElementById('mDownload');
const dockProgress = document.getElementById('dockProgress');
const bars = [progressBar, dockProgress.querySelector('i')];
let exporting = false;

async function exportVideo() {
  if (exporting) return;
  exporting = true;
  dlVideo.disabled = dlStill.disabled = mDownload.disabled = true;
  progressEl.hidden = dockProgress.hidden = false;
  const onProgress = p => bars.forEach(b => { b.style.width = (clamp01(p) * 100).toFixed(1) + '%'; });
  try {
    await fontsReady;
    const configs = await avcConfigs();
    let blob = null, lastErr = null;
    for (const config of configs) {
      try {
        notify('Rendering video…', { sticky: true });
        onProgress(0);
        blob = await exportMp4(config, onProgress);
        break;
      } catch (err) {
        lastErr = err;   // try the next encoder setting
      }
    }
    if (blob) {
      download(blob, slug() + '.mp4');
    } else if (!configs.length) {
      notify('Recording in real time…', { sticky: true });
      const rec = await exportRecorded(onProgress);
      download(rec.blob, slug() + '.' + rec.ext);
    } else {
      throw lastErr;
    }
    onProgress(1);
    notify('Video downloaded');
    note.textContent = 'Downloaded. ' + noteDefault;
  } catch (err) {
    console.error(err);
    notify('Export failed: ' + (err && err.message ? err.message : err));
  } finally {
    exporting = false;
    dlVideo.disabled = dlStill.disabled = mDownload.disabled = false;
    setTimeout(() => {
      progressEl.hidden = dockProgress.hidden = true;
      bars.forEach(b => { b.style.width = '0'; });
    }, 1200);
  }
}
dlVideo.addEventListener('click', exportVideo);

/* PNG: pick 1x / 2x / 4x from a small menu */
const pngMenu = document.getElementById('pngMenu');

function toggleMenu(open) {
  pngMenu.hidden = !open;
  dlStill.setAttribute('aria-expanded', String(open));
  if (open) pngMenu.querySelector('button').focus();
}

async function exportPng(scale) {
  await fontsReady;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  draw(canvas.getContext('2d'), END, scale);
  canvas.toBlob(b => {
    if (!b) { notify(`This browser can’t create a ${scale}x image. Try a smaller size.`); return; }
    download(b, slug() + (scale > 1 ? `@${scale}x` : '') + '.png');
    notify(`PNG ${scale}x downloaded`);
    note.textContent = noteDefault;
  }, 'image/png');
}

dlStill.addEventListener('click', () => toggleMenu(pngMenu.hidden));
pngMenu.addEventListener('click', e => {
  const item = e.target.closest('[data-scale]');
  if (!item) return;
  toggleMenu(false);
  exportPng(Number(item.dataset.scale));
});
pngMenu.addEventListener('keydown', e => {
  const items = [...pngMenu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Escape') { e.stopPropagation(); toggleMenu(false); dlStill.focus(); }
});
document.addEventListener('pointerdown', e => {
  if (!pngMenu.hidden && !e.target.closest('.menu-wrap')) toggleMenu(false);
});

/* Mobile download sheet: Video · PNG › (1x / 2x / 4x) */
const sheet = document.getElementById('sheet');

function showPage(name, dir) {
  sheet.querySelectorAll('.sheet-page').forEach(p => {
    const on = p.dataset.page === name;
    p.hidden = !on;
    p.classList.remove('from-left', 'from-right');
    if (on && dir) { void p.offsetWidth; p.classList.add(dir === 'fwd' ? 'from-right' : 'from-left'); }
  });
}
function openSheet(open) {
  sheet.hidden = !open;
  mDownload.setAttribute('aria-expanded', String(open));
  if (open) showPage('main');
}

mDownload.addEventListener('click', () => openSheet(sheet.hidden));
sheet.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.act === 'video') { openSheet(false); exportVideo(); }
  else if (btn.dataset.act === 'png') showPage('png', 'fwd');
  else if (btn.dataset.act === 'back') showPage('main', 'back');
  else if (btn.dataset.scale) { openSheet(false); exportPng(Number(btn.dataset.scale)); }
});
document.addEventListener('pointerdown', e => {
  if (!sheet.hidden && !e.target.closest('.sheet-wrap')) openSheet(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) openSheet(false);
});

/* ───────────────────────── Boot ───────────────────────── */
const fontsReady = document.fonts
  ? Promise.all(['400', '500', '700'].map(w => document.fonts.load(w + ' 24px Satoshi'))).catch(() => {})
  : Promise.resolve();

fontsReady.then(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { pause(); setTime(END); }
  else play(0);
});
</script>
</body>
</html>
